<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Voice of TN</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <a href="./index.html" class="logo">🔊 Voice of <span>TN</span></a>
        <div class="nav-links">
            <a href="./index.html">Home</a>
            <a href="./register.html">Register</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card fade-in">
            <div class="auth-logo">🔊</div>
            <h2>Welcome Back</h2>
            <p class="auth-sub">Login to Voice of TN</p>

            <div class="error-msg" id="loginError"
                style="display:none; margin-bottom:14px; padding:10px 14px; background:rgba(231,76,60,0.08); border-left:3px solid var(--danger); border-radius:6px;">
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative">
                    <input type="password" id="password" placeholder="Your password" style="padding-right:45px">
                    <span onclick="togglePassword('password')"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.1rem">👁️</span>
                </div>
            </div>

            <button class="btn btn-primary" id="submitBtn" onclick="handleLogin()" style="width:100%">
                Login
            </button>

            <p class="auth-footer">Don't have an account? <a href="./register.html">Register</a></p>
            <p class="auth-footer" style="margin-top:6px">Are you an Admin? <a href="./admin_login.html">Admin Login</a>
            </p>
        </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/login.js"></script>
</body>
</html>
