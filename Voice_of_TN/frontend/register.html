<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Voice of TN</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <nav class="navbar">
        <a href="./index.html" class="logo">🔊 Voice of <span>TN</span></a>
        <div class="nav-links">
            <a href="./index.html">Home</a>
            <a href="./login.html">Login</a>
        </div>
    </nav>

    <div class="auth-wrapper">
        <div class="auth-card fade-in">
            <div class="auth-logo">🔊</div>
            <h2>Create Account</h2>
            <p class="auth-sub">Join Voice of TN — Be heard</p>

            <div class="success-msg" id="successMsg"></div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <div class="error-msg" id="nameError"></div>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="your@email.com">
                <div class="error-msg" id="emailError"></div>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10">
                <div class="error-msg" id="phoneError"></div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative">
                    <input type="password" id="password" placeholder="Minimum 6 characters" style="padding-right:45px">
                    <span onclick="togglePassword('password')"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.1rem">👁️</span>
                </div>
                <div class="error-msg" id="passwordError"></div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div style="position:relative">
                    <input type="password" id="confirmPassword" placeholder="Repeat password"
                        style="padding-right:45px">
                    <span onclick="togglePassword('confirmPassword')"
                        style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:1.1rem">👁️</span>
                </div>
                <div class="error-msg" id="confirmError"></div>
            </div>

            <button class="btn btn-primary" id="submitBtn" onclick="handleRegister()" style="width:100%">
                Create Account
            </button>

            <p class="auth-footer">Already have an account? <a href="./login.html">Login here</a></p>
            <p class="auth-footer" style="margin-top:6px">Are you an Admin? <a href="./admin_login.html">Admin Login</a>
            </p>
        </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/register.js"></script>
</body>

</html>
