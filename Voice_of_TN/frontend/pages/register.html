<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Voice of TN</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

<nav class="navbar">
    <div class="logo" onclick="window.location.href='../index.html'">🔊 Voice of TN</div>
    <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="./login.html">Login</a>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">🔊</div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-sub">Join Voice of TN — File complaints, Track progress</p>

        <div class="success-msg" id="successMsg"></div>

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name">
            <div class="error-msg" id="nameError"></div>
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email">
            <div class="error-msg" id="emailError"></div>
        </div>
        <div class="form-group">
            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="10 digit number">
            <div class="error-msg" id="phoneError"></div>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min 6 characters">
            <div class="error-msg" id="passwordError"></div>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter password">
            <div class="error-msg" id="confirmError"></div>
        </div>

        <button class="btn btn-primary" id="submitBtn" onclick="handleRegister()" style="width:100%;justify-content:center;margin-top:0.5rem">
            Create Account
        </button>

        <p class="auth-footer">Already have an account? <a href="./login.html">Login here</a></p>
    </div>
</div>

<script src="../js/config.js"></script>
<script>
    if (isLoggedIn()) window.location.href = '../index.html';

    function showError(id, msg) {
        const el = document.getElementById(id);
        el.textContent = msg;
        el.style.display = 'block';
    }

    function clearErrors() {
        document.querySelectorAll('.error-msg').forEach(e => e.style.display = 'none');
    }

    function isValidEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function isValidPhone(phone) {
        return /^[0-9]{10}$/.test(phone);
    }

    async function handleRegister() {
        clearErrors();
        document.getElementById('successMsg').style.display = 'none';

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        let hasError = false;

        if (name.length < 2) { showError('nameError', 'Name must be at least 2 characters'); hasError = true; }
        if (!isValidEmail(email)) { showError('emailError', 'Enter a valid email address'); hasError = true; }
        if (!isValidPhone(phone)) { showError('phoneError', 'Enter a valid 10-digit phone number'); hasError = true; }
        if (password.length < 6) { showError('passwordError', 'Password must be at least 6 characters'); hasError = true; }
        if (password !== confirmPassword) { showError('confirmError', 'Passwords do not match'); hasError = true; }

        if (hasError) return;

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Registering...';

        try {
            // Step 1: Register
            const regRes = await fetch(`${API_BASE_URL}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, phone, password })
            });

            if (!regRes.ok) {
                const err = await regRes.json();
                showError('emailError', err.detail || 'Registration failed');
                return;
            }

            // Step 2: Auto-login
            const loginRes = await fetch(`${API_BASE_URL}/api/auth/login/json`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (!loginRes.ok) {
                const successEl = document.getElementById('successMsg');
                successEl.textContent = 'Registered! Please login.';
                successEl.style.display = 'block';
                setTimeout(() => window.location.href = './login.html', 1500);
                return;
            }

            const data = await loginRes.json();
            localStorage.setItem('access_token', data.access_token);
            localStorage.setItem('token_type', data.token_type);
            localStorage.setItem('user_email', data.user_email);
            localStorage.setItem('role', data.role || 'user');

            const successEl = document.getElementById('successMsg');
            successEl.textContent = '✅ Registration successful! Redirecting to home...';
            successEl.style.display = 'block';

            setTimeout(() => window.location.href = '../index.html', 1000);

        } catch(err) {
            showError('emailError', 'Network error. Is the backend running?');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    }

    // Enter key support
    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
</script>
</body>
</html>
