<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM Admin - Voice of TN</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <a href="./cm_admin_dashboard.html" class="logo">🔊 Voice of <span>TN</span></a>
        <div class="nav-links">
            <span style="color:rgba(255,255,255,0.7);font-size:0.85rem" id="adminName"></span>
            <a href="./cm_admin_dashboard.html">Home</a>
            <a href="./cm_admin_dashboard.html">Dashboard</a>
            <span
                style="background:rgba(142,68,173,0.3);color:#D7BDE2;padding:4px 10px;border-radius:20px;font-size:0.78rem;font-weight:700">CM
                ADMIN</span>
            <button class="btn-logout" onclick="adminLogout()">Logout</button>
        </div>
    </nav>

    <div class="page-header" style="background:linear-gradient(135deg,#4A235A,#6C3483)">
        <div class="container">
            <h1>CM Admin Dashboard</h1>
            <p>Final resolution authority - Mark complaints as Solved</p>
        </div>
    </div>

    <div class="container section">
        <div class="admin-stats fade-in" id="adminStats"></div>

        <div class="card fade-in-delay-1" style="margin-bottom:24px">
            <div class="filter-row">
                <div class="fgroup">
                    <label>Filter by Department</label>
                    <select id="aDept" onchange="applyFilter()">
                        <option value="">All Departments</option>
                    </select>
                </div>
                <div class="fgroup">
                    <label>Filter by Status</label>
                    <select id="aStatus" onchange="applyFilter()">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="under_investigation">Under Investigation</option>
                        <option value="resolved">Resolved</option>
                        <option value="solved">Solved</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="adminList" class="fade-in-delay-2">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal" style="display:none">
        <div class="modal-card">
            <h3>Resolve Complaint <span id="modalId"></span></h3>
            <p style="color:var(--text-light);font-size:0.85rem;margin-bottom:16px" id="modalDesc"></p>

            <div class="form-group">
                <label>Update Status</label>
                <select id="newStatus">
                    <option value="under_investigation">Forward to Department</option>
                    <option value="solved">Solved</option>
                </select>
            </div>

            <!-- ✅ Forward to Department Admin -->
            <div class="form-group">
                <label>Forward to Department Admin</label>
                <select id="assignAdmin">
                    <option value="">-- Auto assign by department --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Message to Citizen (required when Solved)</label>
                <textarea id="adminMsg" placeholder="Explain resolution to citizen..." rows="3"></textarea>
            </div>

            <div class="modal-btns">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="updateStatus()">Update</button>
            </div>
        </div>
    </div>

    <footer class="footer">2026 Voice of TN - CM Admin</footer>
    <script src="./js/config.js"></script>
    <script src="./js/cm_admin.js"></script>
</body>

</html>
