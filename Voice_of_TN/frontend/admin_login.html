<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Voice of TN</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<nav class="navbar">
    <a href="./index.html" class="logo">🔊 Voice of <span>TN</span></a>
    <div class="nav-links">
        <a href="./index.html">Home</a>
        <a href="./login.html">Citizen Login</a>
    </div>
</nav>

<div class="auth-wrapper">
    <div class="auth-card fade-in">
        <div class="auth-logo"></div>
        <h2>Admin Login</h2>
        <p class="auth-sub">Restricted Access Only</p>

        <div class="error-msg" id="loginError" style="display:none; margin-bottom:14px; padding:10px 14px; background:rgba(231,76,60,0.08); border-left:3px solid var(--danger); border-radius:6px;"></div>

        <!-- Admin Type Selector -->
        <div class="form-group">
            <label>Admin Type</label>
            <select id="adminRole">
                <option value="c_admin"> Department Admin (c_admin)</option>
                <option value="cm_admin"> CM Admin (cm_admin)</option>
            </select>
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Admin username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Admin password">
        </div>

        <button class="btn btn-primary" id="submitBtn" onclick="handleAdminLogin()" style="width:100%">
            Login as Admin
        </button>

        <p class="auth-footer">Not an admin? <a href="./login.html">Citizen Login</a></p>
    </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/admin_login.js"></script>
</body>
</html>
