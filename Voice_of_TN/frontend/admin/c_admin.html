<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C_Admin Dashboard - Voice of TN</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<nav class="navbar">
    <div class="logo" onclick="window.location.href='../index.html'">🔊 Voice of TN</div>
    <div class="nav-links">
        <span class="admin-role-badge">🏢 C_Admin</span>
        <span id="adminName" style="color:var(--text-muted);font-size:0.9rem"></span>
        <button onclick="adminLogout()" class="btn btn-outline" style="font-size:0.85rem">Logout</button>
    </div>
</nav>

<div class="admin-container">
    <h1 class="admin-title">🏢 Department Admin Dashboard</h1>
    <p class="admin-sub">Review and update complaint statuses</p>

    <!-- STATS -->
    <div class="admin-stats" id="adminStats">
        <div class="astat"><span id="sTotal">--</span><small>Total</small></div>
        <div class="astat pending"><span id="sPending">--</span><small>Pending</small></div>
        <div class="astat progress"><span id="sProgress">--</span><small>In Progress</small></div>
        <div class="astat completed"><span id="sCompleted">--</span><small>Completed</small></div>
        <div class="astat solved"><span id="sSolved">--</span><small>Solved</small></div>
    </div>

    <!-- FILTERS -->
    <div class="admin-filters">
        <select id="filterStatus" onchange="loadComplaints()">
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="in_progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="solved">Solved</option>
        </select>
        <select id="filterDept" onchange="loadComplaints()">
            <option value="">All Departments</option>
        </select>
    </div>

    <!-- TABLE -->
    <div id="complaintsList" class="admin-list">
        <div class="loading">Loading complaints...</div>
    </div>
</div>

<!-- UPDATE MODAL -->
<div class="modal-overlay" id="updateModal" style="display:none">
    <div class="modal-card">
        <div class="modal-header">
            <h3>Update Complaint #<span id="modalId"></span></h3>
            <button onclick="closeModal()" style="background:none;border:none;color:var(--text-muted);font-size:1.5rem;cursor:pointer">×</button>
        </div>
        <p id="modalDesc" style="font-size:0.9rem;color:var(--text-muted);margin-bottom:1.2rem;line-height:1.6"></p>
        <div class="form-group">
            <label>Update Status</label>
            <select id="newStatus">
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
            </select>
        </div>
        <div class="form-group">
            <label>Message to Citizen (Optional)</label>
            <textarea id="adminMsg" rows="3" placeholder="Write a message about the status update..."></textarea>
        </div>
        <div style="display:flex;gap:0.75rem;margin-top:1rem">
            <button class="btn btn-primary" onclick="updateStatus()">Update Status</button>
            <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
        </div>
        <div class="success-msg" id="updateSuccess" style="margin-top:0.75rem;display:none"></div>
        <input type="hidden" id="updateComplaintId">
    </div>
</div>

<footer>© 2026 Voice of TN — C_Admin Portal</footer>

<script src="../js/config.js"></script>
<script>
    const adminToken = localStorage.getItem('admin_token');
    const adminRole = localStorage.getItem('admin_role');
    const adminUsername = localStorage.getItem('admin_username');

    if (!adminToken || adminRole !== 'c_admin') {
        window.location.href = './admin_login.html';
    }

    document.getElementById('adminName').textContent = adminUsername || '';

    function adminLogout() {
        localStorage.removeItem('admin_token');
        localStorage.removeItem('admin_role');
        localStorage.removeItem('admin_username');
        window.location.href = './admin_login.html';
    }

    function adminAuthHeaders() {
        return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${adminToken}` };
    }

    async function loadStats() {
        try {
            const res = await fetch(`${API_BASE_URL}/api/admin/dashboard`, { headers: adminAuthHeaders() });
            const data = await res.json();
            document.getElementById('sTotal').textContent = data.total;
            document.getElementById('sPending').textContent = data.pending;
            document.getElementById('sProgress').textContent = data.in_progress;
            document.getElementById('sCompleted').textContent = data.completed;
            document.getElementById('sSolved').textContent = data.solved;
        } catch(e) {}
    }

    function populateFilters() {
        const deptSel = document.getElementById('filterDept');
        DEPARTMENTS.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d; opt.textContent = d;
            deptSel.appendChild(opt);
        });
    }

    async function loadComplaints() {
        const status = document.getElementById('filterStatus').value;
        const dept = document.getElementById('filterDept').value;

        let url = `${API_BASE_URL}/api/admin/complaints?`;
        if (status) url += `status=${status}&`;
        if (dept) url += `department=${encodeURIComponent(dept)}`;

        const container = document.getElementById('complaintsList');
        container.innerHTML = '<div class="loading">Loading...</div>';

        try {
            const res = await fetch(url, { headers: adminAuthHeaders() });
            const complaints = await res.json();

            if (!complaints.length) {
                container.innerHTML = '<div class="loading">No complaints found.</div>';
                return;
            }

            container.innerHTML = complaints.map(c => {
                const s = getStatusBadge(c.status);
                return `
                <div class="admin-card">
                    <div class="ac-head">
                        <div>
                            <span class="ac-id">#${c.id}</span>
                            <span class="ac-dept">${c.department}</span>
                        </div>
                        <span class="badge ${s.class}">${s.label}</span>
                    </div>
                    <div class="ac-info">
                        <strong>${c.name}</strong> · ${c.district} · ${c.subcategory}
                    </div>
                    <p class="ac-desc">${c.description.substring(0, 180)}${c.description.length > 180 ? '...' : ''}</p>
                    <div class="ac-meta">
                        <span>Age: ${c.age} · ${c.gender}</span>
                        <span>📅 ${formatDate(c.created_at)}</span>
                        ${c.voice_file ? `<a href="${API_BASE_URL}${c.voice_file}" target="_blank" class="ac-link">🎤 Voice</a>` : ''}
                        ${c.attachment ? `<a href="${API_BASE_URL}${c.attachment}" target="_blank" class="ac-link">📎 File</a>` : ''}
                    </div>
                    ${c.admin_message ? `<div class="ac-msg">💬 ${c.admin_message}</div>` : ''}
                    ${c.status !== 'solved' ? `<button class="btn btn-secondary ac-update-btn" onclick="openModal(${c.id}, '${c.description.replace(/'/g,"\\'")}')">✏️ Update Status</button>` : '<span style="color:var(--success-light);font-size:0.85rem">✅ Solved</span>'}
                </div>`;
            }).join('');
        } catch(e) {
            container.innerHTML = '<div class="loading">Failed to load.</div>';
        }
    }

    function openModal(id, desc) {
        document.getElementById('updateComplaintId').value = id;
        document.getElementById('modalId').textContent = id;
        document.getElementById('modalDesc').textContent = desc;
        document.getElementById('adminMsg').value = '';
        document.getElementById('updateSuccess').style.display = 'none';
        document.getElementById('updateModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('updateModal').style.display = 'none';
    }

    async function updateStatus() {
        const id = document.getElementById('updateComplaintId').value;
        const status = document.getElementById('newStatus').value;
        const admin_message = document.getElementById('adminMsg').value;
        const suc = document.getElementById('updateSuccess');

        try {
            const res = await fetch(`${API_BASE_URL}/api/admin/complaints/${id}/status`, {
                method: 'PUT',
                headers: adminAuthHeaders(),
                body: JSON.stringify({ status, admin_message })
            });

            if (res.ok) {
                suc.textContent = '✅ Status updated successfully!';
                suc.style.display = 'block';
                await loadStats();
                await loadComplaints();
                setTimeout(closeModal, 1500);
            }
        } catch(e) {
            suc.textContent = '❌ Update failed.';
            suc.style.display = 'block';
        }
    }

    populateFilters();
    loadStats();
    loadComplaints();
</script>
</body>
</html>
